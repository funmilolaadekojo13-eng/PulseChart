<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow-ups · PulseChart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.fugroup{margin-bottom:22px}
.fugroup > h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.fugroup > h2 .cnt{background:var(--soft);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--mut)}
.furow{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.furow:hover{border-color:var(--acc);box-shadow:0 2px 10px rgba(20,30,25,.05)}
.fuinfo{min-width:0}
.funame{font-weight:600;font-size:14px}
.fumeta{font-size:11.5px;color:var(--mut);margin-top:1px}
.dstat{margin-left:auto;font-size:11px;font-weight:700;border-radius:7px;padding:4px 10px;white-space:nowrap;flex:none}
.dstat.overdue{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.dstat.today{background:var(--amber-bg);color:var(--amber)}
.dstat.upcoming{background:var(--tint);color:var(--tint-fg)}
.fuactions{display:flex;gap:7px;flex:none}
.nowrap{white-space:nowrap}
@media(max-width:640px){.furow{flex-wrap:wrap}.dstat{margin-left:0;order:3}.fuactions{margin-left:auto}}
</style>
</head>
<body>
<section id="app">
  <aside class="side">
    <div class="slogo">PulseChart<small class="practice"></small></div>
    <nav class="nav">
      <span data-ic="users">Patients</span>
      <span class="on" data-ic="calendar">Follow-ups</span>
      <span data-ic="pill">Drug favorites</span>
    </nav>
    <div class="sunav">Clinic</div>
    <nav class="nav">
      <span data-ic="userplus">Staff</span>
      <span data-ic="sliders">Settings<span class="soon">soon</span></span>
    </nav>
    <div class="suser">
      <div><b id="sideName"></b><small id="sideRole"></small></div>
      <button id="btnOut" class="sout" title="Sign out" data-ic="logout" data-size="16"></button>
    </div>
  </aside>

  <div class="cont">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button id="btnBackHist" class="btn-ghost" type="button" data-ic="chevleft" data-size="13">Back</button>
        <span class="crumb">Clinic / <b>Follow-ups</b></span>
      </div>
      <div class="userchip"><span id="who"></span><span class="av" id="whoAv"></span></div>
    </div>
    <main>
      <div class="page-head"><h1 class="page-title">Follow-ups</h1></div>
      <p class="count-note">Each patient's latest follow-up shows here. If a patient has come in, record the visit and set their next date, and this list updates itself.</p>
      <div id="groups"></div>
    </main>
  </div>
</section>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="followups.js"></script>
</body>
</html>
